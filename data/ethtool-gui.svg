    <rect x="71.0" y="73" width="3.6" height="14" rx="1.2"/>
    <rect x="77.1" y="73" width="3.6" height="14" rx="1.2"/>
    <rect x="83.2" y="73" width="3.6" height="14" rx="1.2"/>
