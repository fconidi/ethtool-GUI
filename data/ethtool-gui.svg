    <rect x="29" y="52" width="70" height="46" rx="6" fill="url(#body)"/>
  </g>
  <path d="M37 60 h17 v-8 h20 v8 h17 v30 H37 z" fill="#0b2138"/>
  <g fill="url(#gold)">
