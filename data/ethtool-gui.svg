  <rect x="38" y="93" width="52" height="2.5" rx="1.2" fill="#7d97ab" opacity="0.55"/>
  <circle cx="95" cy="34" r="8" fill="url(#led)" stroke="#06261a" stroke-opacity="0.45" stroke-width="1"/>
  <circle cx="92.5" cy="31.5" r="2.4" fill="#ffffff" opacity="0.7"/>
